<style>
  :root{
    --ink:#0C1B33; --ink-soft:#3A4A66; --ink-faint:#93A3BC;
    --sapphire:#2456C7; --sapphire-deep:#16337A; --sky:#7FA6E8;
    --ice:#EEF3FA; --panel:#FFFFFF; --line:#DCE5F2;
    --teal:#2FA39A; --apricot:#E8956B; --red:#C4554D; --gold:#B98A2F;
    --teal-text:#1d7d76; --red-text:#a53f38; --gold-text:#8a6412;
    --radius:14px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ice);color:var(--ink);font-family:var(--sans);font-size:14px;}
  h1,h2,.serif{font-family:var(--serif);}
  .sticky-wrap{position:sticky;top:0;z-index:30;}
  header.hero{background:linear-gradient(135deg, var(--ink) 0%, var(--sapphire-deep) 100%);}
  .hero-inner{max-width:1520px;margin:0 auto;padding:18px 96px 0;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--sky);margin-bottom:4px;font-weight:600;}
  .hero-title{margin:0;font-size:28px;font-weight:700;color:#fff;letter-spacing:.2px;}
  .hero-sub{font-size:12px;color:var(--sky);padding-bottom:2px;}
  .maintabs{display:flex;gap:4px;margin-top:14px;}
  .maintabs button{background:rgba(255,255,255,0.08);border:none;color:#C9D8F0;padding:10px 20px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;}
  .maintabs button.active{background:var(--ice);color:var(--ink);}
  .subbar{background:var(--panel);border-bottom:1px solid var(--line);}
  .subbar-inner{max-width:1520px;margin:0 auto;padding:12px 96px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .plaques{display:flex;gap:8px;}
  .plaque{background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:8px 16px;text-align:left;cursor:pointer;min-width:150px;transition:.15s;}
  .plaque.active{background:var(--sapphire-deep);border-color:var(--sapphire-deep);box-shadow:0 -2px 0 0 var(--gold) inset;}
  .plaque .city{font-size:13px;font-weight:700;color:var(--ink);}
  .plaque.active .city{color:#fff;}
  .plaque .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .plaque.active .meta{color:var(--sky);}
  .toggle-row{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .toggle-row button{background:var(--panel);border:none;color:var(--ink-soft);padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .toggle-row button.active{background:var(--sapphire);color:#fff;}
  .daterange{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .daterange input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--ink);background:var(--panel);font-family:var(--sans);}
  main{padding:24px 96px 60px;max-width:1520px;margin:0 auto;}
  .section-title{font-size:16px;font-weight:600;margin:32px 0 14px;display:flex;align-items:baseline;gap:10px;color:var(--ink);}
  .section-title .sub{font-size:11.5px;color:var(--ink-soft);font-family:var(--sans);font-weight:500;}
  .scorecards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  @media(max-width:1400px){.scorecards{grid-template-columns:repeat(3,1fr);}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;}
  .card.dark{background:var(--sapphire-deep);border-color:var(--sapphire-deep);}
  .card .label{color:var(--ink-soft);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;}
  .card.dark .label{color:var(--sky);}
  .card .value{font-size:25px;font-weight:600;margin-bottom:8px;letter-spacing:-.2px;font-family:var(--serif);color:var(--ink);}
  .card.dark .value{color:#fff;}
  .card .share-inline, .metric-card .share-inline{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-left:8px;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .badge .arrow.up{color:var(--teal-text);}
  .badge .arrow.down{color:var(--red-text);}
  .badge .tag{color:var(--ink-faint);font-weight:600;}
  .card.dark .badge .tag{color:var(--sky);}
  .grid-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:1400px){.grid-metrics{grid-template-columns:repeat(2,1fr);}}
  .grid-metrics.cols-2{grid-template-columns:repeat(2,1fr);}
  .metric-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 12px;}
  .metric-card .name{font-size:12px;font-weight:500;color:var(--ink);text-transform:uppercase;letter-spacing:0.4px;}
  .metric-card .value{font-size:21px;font-weight:600;margin:3px 0 2px;font-family:var(--serif);color:var(--ink);}
  .metric-card .badges{margin:2px 0 10px;}
  .metric-card canvas{width:100%!important;height:128px!important;}
  .legend-mini{display:flex;gap:12px;font-size:10.5px;color:var(--ink-faint);margin:2px 0 8px;}
  .legend-mini span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .panel-wide{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .panel-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--ink-soft);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  tr:hover td{background:var(--ice);}
  .status-pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;}
  .status-active{background:#2FA39A22;color:var(--teal-text);}
  .status-inactive{background:#93A3BC22;color:var(--ink-faint);}
  .table-wrap{overflow-x:auto;}
  .plat-val{font-weight:700;font-size:14px;font-family:var(--serif);}
  .note{color:var(--ink-faint);font-size:11.5px;margin-top:10px;}
  .chart-box{position:relative;height:320px;}
  .chart-box.tall{height:360px;}
  footer{padding:24px 96px;color:var(--ink-faint);font-size:11.5px;text-align:center;border-top:1px solid var(--line);}
  .insight-cell{white-space:normal;max-width:260px;color:var(--ink-soft);font-size:11.5px;line-height:1.4;}
  .filter-btns{display:flex;gap:6px;}
  .filter-btns button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
  .filter-btns button.active{background:var(--sapphire);border-color:var(--sapphire);color:#fff;}
  .campaigns-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .totals-row td{font-weight:700;background:var(--ice);}
  #app{display:block;}
  #app.hidden{display:none;}
  .cell-good{background:#2FA39A1c;color:#1d7d76;font-weight:700;}
  .cell-warn{background:#B98A2F26;color:#8a6412;font-weight:700;}
  .cell-bad{background:#C4554D1c;color:#a53f38;font-weight:700;}
  .empty-row td{text-align:center;color:var(--ink-faint);padding:26px 10px;font-style:italic;}
  .provider-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
</style>
</head>

<div class="sticky-wrap">
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div>
        <div class="eyebrow">Practice Analytics</div>
        <h1 class="hero-title">Sapphire Dermatology</h1>
      </div>
      <div class="hero-sub" id="lastUpdateSub"></div>
    </div>

<div class="subbar" id="perfSubbar">

    <div class="toggle-row" id="periodTabs">
      <button data-period="30days" class="active">Last 30 Days</button>
      <button data-period="7days">Last 7 Days</button>
    </div>
  </div>
</div>
<div class="subbar" id="campSubbar" style="display:none;">
  <div class="subbar-inner">
    <div class="daterange">
      <span>Date range</span>
      <input type="date" id="dateFrom">
      <span>to</span>
      <input type="date" id="dateTo">
    </div>
    <div class="filter-btns" id="statusFilter">
      <button data-status="all" class="active">All</button>
      <button data-status="Active">Active</button>
      <button data-status="Inactive">Inactive</button>

  </div>
</div>
</div>

function fmtInt(v){ if(v===undefined||v===null||isNaN(v)) return '—'; return Math.round(v).toLocaleString('en-US'); }
function fmtUsd(v){ if(v===undefined||v===null||isNaN(v)) return '—'; return '$'+Math.round(v).toLocaleString('en-US'); }
function fmtUsd2(v){ if(v===undefined||v===null||isNaN(v)) return '—'; return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct(v){ if(v===undefined||v===null||isNaN(v)) return '—'; return (v*100).toFixed(1)+'%'; }
function isAdPlatformKey(key){ return key && (key.indexOf('google_')===0 || key.indexOf('meta_')===0); }
function fmtVal(key,v){ const f=METRIC_FORMAT[key]||'int'; if(f==='usd') return isAdPlatformKey(key) ? fmtUsd2(v) : fmtUsd(v); return f==='pct'?fmtPct(v):fmtInt(v); }
function pctChange(cur,prev){ if(!prev) return null; return (cur-prev)/Math.abs(prev); }

function badge(label,val,key){
  const invert = key ? INVERTED.has(key) : false;
  if(val===null||val===undefined||isNaN(val)) return '<span class="badge" style="color:var(--ink-faint);"><span class="tag">'+label+'</span> —</span>';
  const up = val>=0;
  const good = invert ? !up : up;
  const arrow = up? '▲':'▼';
  return '<span class="badge"><span class="arrow '+(good?'up':'down')+'">'+arrow+' '+Math.abs(val*100).toFixed(1)+'%</span><span class="tag">'+label+'</span></span>';
}

function seriesFor(loc,period,key){
  const block = DATA.locations[loc][period];
  return { labels: block.current.map(r=>r.label), current: block.current.map(r=>r[key]), previous: block.previous.map(r=>r[key]) };
}
function deltas(loc,period,key){
  const block = DATA.locations[loc][period];
  const cur = block.current.map(r=>r[key]);
  const prev = block.previous.map(r=>r[key]);
  const n = cur.length;
  return { momwow: pctChange(cur[n-1], cur[n-2]), yoy: pctChange(cur[n-1], prev[n-1]), latest: cur[n-1] };
}

function renderPlatformSummary(loc,period){
  const metrics = [['adspend','Ad Spend'],['impression','Impressions'],['clicks','Clicks'],['lead','Leads'],['conversion','Conversions'],['cpm','CPM'],['cpc','CPC'],['cpl','CPL'],['cpa','CPA']];
  const NON_SUMMABLE = new Set(['cpm','cpc','cpl','cpa']); // ratio metrics: recompute from summed base numbers instead of adding
  const cell = (platform,metric)=>{
    const key = platform+'_'+metric;
    const d = deltas(loc,period,key);
    return '<td><div class="plat-val">'+fmtVal(key,d.latest)+'</div>'+
      '<div class="badges" style="margin-top:4px;">'+badge(period==='30days'?'MoM':'WoW', d.momwow, key)+badge('YoY', d.yoy, key)+'</div></td>';
  };
  const totalCell = (metric)=>{
    const last = DATA.locations[loc][period].current[DATA.locations[loc][period].current.length-1];
    if(NON_SUMMABLE.has(metric)){
      const cost = last.google_adspend + last.meta_adspend;
      let val;
      if(metric==='cpm') val = (last.google_impression+last.meta_impression) ? cost/(last.google_impression+last.meta_impression)*1000 : 0;
      if(metric==='cpc') val = (last.google_clicks+last.meta_clicks) ? cost/(last.google_clicks+last.meta_clicks) : 0;
      if(metric==='cpl') val = (last.google_lead+last.meta_lead) ? cost/(last.google_lead+last.meta_lead) : 0;
      if(metric==='cpa') val = (last.google_conversion+last.meta_conversion) ? cost/(last.google_conversion+last.meta_conversion) : 0;
      return '<td><div class="plat-val">'+fmtUsd2(val)+'</div></td>';
    }
    const key = 'google_'+metric, key2 = 'meta_'+metric;
    const total = last[key] + last[key2];
    return '<td><div class="plat-val">'+fmtVal(key,total)+'</div></td>';
  };
  const rows = metrics.map(m=>'<tr><td class="metric-name" style="color:var(--ink-soft);font-weight:600;">'+m[1]+'</td>'+cell('meta',m[0])+cell('google',m[0])+totalCell(m[0])+'</tr>').join('');
  return '<div class="panel-wide"><div class="panel-title"><span>Platform Summary</span></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Metric</th><th>Facebook Ads</th><th>Google Ads</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

let campState = { status:'all', from:null, to:null };

function allDates(arr){ return arr.map(r=>r[0]); }
function initCampaignDates(){
  const all = allDates(GAFA.google).concat(allDates(GAFA.facebook));
  const min = all.reduce((a,b)=> b<a?b:a);
  const max = all.reduce((a,b)=> b>a?b:a);
  const maxDate = new Date(max+'T00:00:00');
  const defaultFromDate = new Date(maxDate.getTime() - 29*24*60*60*1000);
  const defaultFromStr = defaultFromDate.toISOString().slice(0,10);
  const from = defaultFromStr > min ? defaultFromStr : min;
  campState.from = from; campState.to = max;
  document.getElementById('dateFrom').value = from;
  document.getElementById('dateFrom').min = min; document.getElementById('dateFrom').max = max;
  document.getElementById('dateTo').value = max;
  document.getElementById('dateTo').min = min; document.getElementById('dateTo').max = max;
}

function aggregate(rows, from, to, status){
  const byCamp = {};
  let totals = {cost:0,impr:0,clicks:0,lead:0,conv:0};
  rows.forEach(r=>{
    const [date,campaign,cost,impr,clicks,lead,conv,loc,st] = r;
    if(date<from || date>to) return;
    if(status!=='all' && st!==status) return;
    if(!byCamp[campaign]) byCamp[campaign] = {campaign, location:loc, status:st, cost:0, impr:0, clicks:0, lead:0, conv:0};
    const c = byCamp[campaign];
    c.cost+=cost; c.impr+=impr; c.clicks+=clicks; c.lead+=lead; c.conv+=conv;
    totals.cost+=cost; totals.impr+=impr; totals.clicks+=clicks; totals.lead+=lead; totals.conv+=conv;
  });
  const list = Object.values(byCamp).sort((a,b)=>b.cost-a.cost);
  return {list, totals};
}

function insightFor(c){
  if(c.status==='Inactive') return '';
  if(c.cost>0 && c.conv===0 && c.cost>200) return 'No conversions despite meaningful spend — audit targeting/landing page or pause.';
  const cpa = c.conv? c.cost/c.conv : null;
  if(cpa!==null && cpa>150) return 'High cost per acquisition ($'+cpa.toFixed(0)+') — tighten audience or adjust bids.';
  const ctr = c.impr? c.clicks/c.impr : null;
  if(ctr!==null && ctr<0.01 && c.impr>1000) return 'Low CTR ('+(ctr*100).toFixed(1)+'%) — refresh ad creative or copy.';
  if(cpa!==null && cpa<50 && c.conv>0) return 'Efficient acquisition cost — consider scaling budget.';
  return 'Performing within normal range — continue monitoring weekly.';
}

function cpaClass(cpa, hasConv, cost){
  if(!hasConv) return cost>0 ? 'cell-bad' : '';
  if(cpa<=75) return 'cell-good';
  if(cpa<=150) return 'cell-warn';
  return 'cell-bad';
}
function cplClass(cpl, hasLead, cost){
  if(!hasLead) return cost>0 ? 'cell-bad' : '';
  if(cpl<=15) return 'cell-good';
  if(cpl<=40) return 'cell-warn';
  return 'cell-bad';
}
function cpcClass(cpc, hasClicks, cost){
  if(!hasClicks) return cost>0 ? 'cell-bad' : '';
  if(cpc<=2) return 'cell-good';
  if(cpc<=5) return 'cell-warn';
  return 'cell-bad';
}
function cpmClass(cpm, hasImpr, cost){
  if(!hasImpr) return cost>0 ? 'cell-bad' : '';
  if(cpm<=30) return 'cell-good';
  if(cpm<=75) return 'cell-warn';
  return 'cell-bad';
}

function campaignTableHtml(title, rows, totals, dateRangeNote, note){
  const cols = ['Status','Campaign','Location','Cost','Leads','Conv.','CPM','CPC','CPL','CPA','Insight / Next Step'];
  const rowHtml = rows.length ? rows.map(c=>{
    const cpm = c.impr? c.cost/c.impr*1000 : 0;
    const cpc = c.clicks? c.cost/c.clicks : 0;
    const cpl = c.lead? c.cost/c.lead : 0;
    const cpa = c.conv? c.cost/c.conv : 0;
    const statusHtml = '<span class="status-pill '+(c.status==='Active'?'status-active':'status-inactive')+'">'+c.status+'</span>';
    return '<tr><td>'+statusHtml+'</td><td>'+c.campaign+'</td><td>'+(c.location||'—')+'</td>'+
      '<td>'+fmtUsd2(c.cost)+'</td>'+
      '<td>'+fmtInt(c.lead)+'</td><td>'+fmtInt(c.conv)+'</td>'+
      '<td class="'+cpmClass(cpm,c.impr>0,c.cost)+'">'+(c.impr?fmtUsd2(cpm):(c.cost>0?'no impr.':'—'))+'</td>'+
      '<td class="'+cpcClass(cpc,c.clicks>0,c.cost)+'">'+(c.clicks?fmtUsd2(cpc):(c.cost>0?'no clicks':'—'))+'</td>'+
      '<td class="'+cplClass(cpl,c.lead>0,c.cost)+'">'+(c.lead?fmtUsd2(cpl):(c.cost>0?'no leads':'—'))+'</td>'+
      '<td class="'+cpaClass(cpa,c.conv>0,c.cost)+'">'+(c.conv?fmtUsd2(cpa):(c.cost>0?'no conv.':'—'))+'</td>'+
      '<td class="insight-cell">'+insightFor(c)+'</td></tr>';
  }).join('') : '<tr class="empty-row"><td colspan="'+cols.length+'">No campaigns with activity in this date range'+(dateRangeNote?' — '+dateRangeNote:'')+'.</td></tr>';
  const tCpm = totals.impr? totals.cost/totals.impr*1000:0, tCpc = totals.clicks? totals.cost/totals.clicks:0, tCpl = totals.lead? totals.cost/totals.lead:0, tCpa = totals.conv? totals.cost/totals.conv:0;
  const totalRow = rows.length ? ('<tr class="totals-row"><td colspan="3">Total (selected range)</td>'+
    '<td>'+fmtUsd2(totals.cost)+'</td>'+
    '<td>'+fmtInt(totals.lead)+'</td><td>'+fmtInt(totals.conv)+'</td>'+
    '<td>'+(totals.impr?fmtUsd2(tCpm):'—')+'</td>'+
    '<td>'+fmtUsd2(tCpc)+'</td>'+
    '<td>'+(totals.lead?fmtUsd2(tCpl):'—')+'</td><td>'+(totals.conv?fmtUsd2(tCpa):'—')+'</td><td></td></tr>') : '';
  return '<div class="panel-wide"><div class="panel-title"><span>'+title+'</span><span style="font-size:11px;color:var(--ink-faint);font-weight:500;">'+rows.length+' campaigns</span></div>'+
    '<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rowHtml+totalRow+'</tbody></table></div>'+
    (note?'<div class="note">'+note+'</div>':'')+'</div>';
}

function renderCampaigns(){
  const from = campState.from, to = campState.to, status = campState.status;
  const g = aggregate(GAFA.google, from, to, status);
  const f = aggregate(GAFA.facebook, from, to, status);
  const gRange = 'GA sheet data available '+GAFA.google[0][0]+' to '+GAFA.google[GAFA.google.length-1][0];
  const fRange = 'FA sheet data available '+GAFA.facebook[0][0]+' to '+GAFA.facebook[GAFA.facebook.length-1][0];
  const legendNote = 'Location shown per campaign in place of a separate location filter. CPM/CPC/CPL/CPA highlighted green (efficient) / yellow (moderate) / red (high, or no impressions/clicks/leads/conversions despite spend).';
  const html = campaignTableHtml('Google Ads by Campaign <span style="font-weight:500;color:var(--ink-faint);font-size:11px;">· source: GA sheet</span>', g.list, g.totals, gRange, gRange+'. '+legendNote) +
    '<div style="height:20px;"></div>' +
    campaignTableHtml('Facebook Ads by Campaign <span style="font-weight:500;color:var(--ink-faint);font-size:11px;">· source: FA sheet</span>', f.list, f.totals, fRange, fRange+'. '+legendNote);
  document.getElementById('appCampaigns').innerHTML = html;
}

document.getElementById('mainTabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#mainTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.view = btn.dataset.view;
  const isPerf = state.view==='performance';
  document.getElementById('perfSubbar').style.display = isPerf?'block':'none';
  document.getElementById('campSubbar').style.display = isPerf?'none':'block';
  document.getElementById('app').classList.toggle('hidden', !isPerf);
  document.getElementById('appCampaigns').classList.toggle('hidden', isPerf);
  if(isPerf) render(); else renderCampaigns();
});
document.getElementById('locTabs').addEventListener('click',e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#locTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.loc = btn.dataset.loc;
  render();
});
document.getElementById('periodTabs').addEventListener('click',e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#periodTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.period = btn.dataset.period;
  render();
});
document.getElementById('statusFilter').addEventListener('click',e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#statusFilter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  campState.status = btn.dataset.status;
  renderCampaigns();
});
document.getElementById('dateFrom').addEventListener('change', e=>{ campState.from = e.target.value; renderCampaigns(); });
document.getElementById('dateTo').addEventListener('change', e=>{ campState.to = e.target.value; renderCampaigns(); });

Chart.defaults.font.family = "'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif";
initCampaignDates();
render();
</script>
</body>
</html>
